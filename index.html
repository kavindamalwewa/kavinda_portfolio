<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />
    <meta
      name="description"
      content="Kavinda Malwewa — IT undergraduate, aspiring AI/ML engineer, software engineering and QA. Portfolio, projects and CV."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kavinda Malwewa — Aspiring AI/ML Engineer" />
    <meta
      property="og:description"
      content="IT Undergraduate · Aspiring AI/ML Engineer · Software Engineering · QA"
    />

    <script>
      // Apply the saved theme before first paint so there is no dark/light flash.
      // Keep the key in sync with src/hooks/useTheme.js.
      // Dark is the default; light only when the visitor chose it.
      (function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('theme-preference') === 'light') theme = 'light'
        } catch (e) {}
        var root = document.documentElement
        root.classList.remove('dark', 'light')
        root.classList.add(theme)
        root.style.colorScheme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafaf8')
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Kavinda Malwewa — Aspiring AI/ML Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
